name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the download bundle
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/tradevmx
          # Only tracked files ship: no .env, no logs, no reports, no venv.
          git archive --format=tar HEAD | tar -x -C dist/tradevmx
          printf '%s\n' "$GITHUB_REF_NAME" > dist/tradevmx/VERSION
          ( cd dist && zip -qr "tradevmx-${version}.zip" tradevmx )
          ls -lh dist

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tradevmx-*.zip
          generate_release_notes: true
          body: |
            Download `tradevmx-${{ github.ref_name }}.zip`, unzip it, and run
            `run_tradevmx.bat` (Windows) or `./run_tradevmx.sh` (macOS/Linux).
            Existing installs can drop the new files over the old folder; your
            `.env` is preserved.
