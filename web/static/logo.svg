<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3d52"/>
      <stop offset="1" stop-color="#05080e"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38e1d6"/>
      <stop offset="0.5" stop-color="#3ddc97"/>
      <stop offset="1" stop-color="#0e8c8a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" stroke="rgba(56,221,151,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="480" fill="url(#bg)"/>
  <rect width="640" height="480" fill="url(#grid)"/>

  <!-- subtle vignette -->
  <circle cx="320" cy="240" r="260" fill="none" stroke="rgba(56,221,151,0.05)" stroke-width="1" filter="url(#glow)"/>

  <!-- brand mark -->
  <g transform="translate(320,170)" filter="url(#glow)">
    <circle cx="0" cy="0" r="56" fill="none" stroke="url(#mark)" stroke-width="2.5" opacity="0.85"/>
    <circle cx="0" cy="0" r="46" fill="url(#mark)" opacity="0.95"/>
    <path d="M0 -34 A34 34 0 0 1 29.4 -21.4" stroke="rgba(255,255,255,0.95)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M0 34 A34 34 0 0 0 29.4 21.4" stroke="rgba(255,255,255,0.95)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(0,18)">
    <text x="0" y="0" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="42" font-weight="800" letter-spacing="1.6" fill="#ffffff">
      TradeVMx
    </text>
    <text x="0" y="54" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" font-weight="600" letter-spacing="3.2" fill="#3ddc97">
      NSE MARKET DESK
    </text>
  </g>

  <!-- badge line -->
  <g transform="translate(0,112)">
    <rect x="0" y="0" width="380" height="8" rx="4" fill="rgba(56,221,151,0.18)"/>
    <rect x="0" y="0" width="260" height="8" rx="4" fill="url(#mark)"/>
  </g>

  <!-- footer -->
  <g transform="translate(0,380)">
    <text x="0" y="0" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="12" fill="#7e93a8" letter-spacing="1.4">
      v1.0.8
    </text>
  </g>
</svg>
